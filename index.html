<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>piodide</title>
  </head>
  <body>
    <main id="agent-view">
      <div id="terminal"></div>
      <div id="command-menu" hidden></div>
    </main>
    <main id="slop-view" hidden>
      <div id="slop-terminal"></div>
    </main>
    <main id="neovim-view" hidden>
      <header id="neovim-toolbar">
        <span>nvim.wasm</span>
        <span id="neovim-status">not loaded</span>
        <span>Ctrl+Shift+E → agent</span>
      </header>
      <div id="neovim-editor"></div>
      <div id="neovim-commandline" aria-live="polite"></div>
    </main>
    <div id="html-preview" hidden>
      <section class="html-preview-window" role="dialog" aria-modal="true" aria-labelledby="html-preview-title">
        <header class="html-preview-header">
          <button id="html-preview-close" type="button" aria-label="Back to agent">
            ← Back to agent
          </button>
          <span id="html-preview-title">HTML preview</span>
        </header>
        <iframe
          id="html-preview-frame"
          title="Generated HTML preview"
          sandbox="allow-scripts allow-forms allow-downloads"
          referrerpolicy="no-referrer"
        ></iframe>
      </section>
    </div>
    <footer id="footer" aria-label="Session status">
      <div class="footer-row">
        <span id="footer-location">/home/web</span>
      </div>
      <div class="footer-row">
        <span id="footer-usage">↑0 ↓0 R0 CH— 0%/200k</span>
        <span id="footer-model">(no provider) —</span>
      </div>
    </footer>
    <div id="status" hidden></div>
    <button
      id="mobile-command-trigger"
      type="button"
      aria-label="Open commands"
      aria-controls="mobile-command-drawer"
      hidden
    >
      /
    </button>
    <div id="mobile-command-layer" aria-hidden="true">
      <button
        id="mobile-command-backdrop"
        type="button"
        aria-label="Close commands"
      ></button>
      <aside
        id="mobile-command-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mobile-command-title"
      >
        <header id="mobile-command-header">
          <span id="mobile-command-title">Commands</span>
          <button id="mobile-command-close" type="button" aria-label="Close commands">
            ×
          </button>
        </header>
        <div id="mobile-command-content"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
